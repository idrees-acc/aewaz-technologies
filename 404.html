<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Aewaz Technologies</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/src/images/logo/aewaz.svg" />
    <script>
      // Old addresses ended in "/" (/services/web-development/); retry without it once
      if (location.pathname.length > 1 && location.pathname.endsWith("/")) location.replace(location.pathname.slice(0, -1) + location.search);
      try {
        localStorage.removeItem("theme");
        var t = sessionStorage.getItem("theme");
        document.documentElement.dataset.theme =
          t || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch (e) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link href="/site.css" rel="stylesheet" />
    <style>
      .nf { min-height: 100dvh; display: grid; place-items: center; padding-block: var(--space-2xl); }
      .nf-inner { max-width: 760px; display: grid; gap: var(--space-lg); }
      .nf-code { font: 400 clamp(6rem, 20vw, 12rem)/0.85 var(--font-display); letter-spacing: -0.06em; color: var(--color-ink); }
      .nf h1 { text-wrap: balance; font-size: var(--text-section); line-height: 1.1; }
      .nf p { color: var(--color-ink-2); max-width: 52ch; }
      .nf-links { display: flex; flex-wrap: wrap; gap: var(--space-sm) var(--space-lg); align-items: center; }
      .nf-list { display: flex; flex-wrap: wrap; gap: var(--space-xs); }
      .nf-list a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 var(--space-md); border: 1px solid var(--color-rule); border-radius: var(--radius-pill); font-size: var(--text-sm); color: var(--color-ink-2); transition: border-color var(--dur-short) var(--ease-out), color var(--dur-short) var(--ease-out); }
      .nf-list a:hover { border-color: var(--color-muted); color: var(--color-ink); }
    </style>
  </head>
  <body>
    <main class="nf">
      <div class="container nf-inner">
        <div class="nf-code" aria-hidden="true">404</div>
        <h1>This page didn&rsquo;t make it to production.</h1>
        <p>The link may be old or mistyped. Everything we do is on the homepage, and we&rsquo;re one message away if you were looking for something specific.</p>
        <div class="nf-links">
          <a class="btn btn-accent" href="/">Go to the homepage</a>
          <a class="link" href="/#contact">Talk to us</a>
        </div>
        <nav class="nf-list" aria-label="Popular sections">
          <a href="/#services">Services</a>
          <a href="/#work">Work</a>
          <a href="/#about">About</a>
          <a href="/privacy-policy">Privacy Policy</a>
        </nav>
      </div>
    </main>
  </body>
</html>
