    <script>
      (function () {
        var root = document.documentElement;
        document.getElementById("year").textContent = new Date().getFullYear();

        // Theme toggle: remembers the visitor's choice
        var themeBtn = document.getElementById("theme-toggle");
        function syncTheme() {
          var light = root.dataset.theme === "light";
          themeBtn.setAttribute("aria-label", light ? "Switch to dark theme" : "Switch to light theme");
          document.querySelector('meta[name="theme-color"]').content = light ? "#faf6f9" : "#0b0710";
        }
        themeBtn.addEventListener("click", function () {
          root.dataset.theme = root.dataset.theme === "light" ? "dark" : "light";
          try { sessionStorage.setItem("theme", root.dataset.theme); } catch (e) {}
          syncTheme();
        });
        syncTheme();

        // Mobile menu
        var nav = document.querySelector(".nav");
        var menuBtn = document.getElementById("menu-toggle");
        function setMenu(open) {
          nav.classList.toggle("open", open);
          menuBtn.setAttribute("aria-expanded", String(open));
          menuBtn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
        }
        menuBtn.addEventListener("click", function () { setMenu(!nav.classList.contains("open")); });
        document.querySelectorAll(".nav-links a").forEach(function (a) {
          a.addEventListener("click", function () { setMenu(false); });
        });
        document.addEventListener("keydown", function (e) { if (e.key === "Escape") setMenu(false); });

        // In-page links scroll without adding #section to the URL
        document.addEventListener("click", function (e) {
          var a = e.target.closest('a[href^="#"]');
          var el = a && document.getElementById(a.hash.slice(1));
          if (!el) return;
          e.preventDefault();
          el.scrollIntoView();
          if (!el.hasAttribute("tabindex")) el.setAttribute("tabindex", "-1");
          el.focus({ preventScroll: true });
        });
        // Arrived via /#contact (404, privacy page): keep the scroll, drop the hash
        if (location.hash) {
          var target = document.getElementById(location.hash.slice(1));
          history.replaceState(null, "", location.pathname);
          if (target) addEventListener("load", function () { target.scrollIntoView({ behavior: "instant" }); });
        }

        // Highlight the nav link for the section in view, and reveal sections
        if ("IntersectionObserver" in window) {
          var links = {};
          document.querySelectorAll(".nav-links a").forEach(function (a) { links[a.hash] = a; });
          var spy = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
              var a = links["#" + en.target.id];
              if (!a || !en.isIntersecting) return;
              Object.values(links).forEach(function (l) { l.removeAttribute("aria-current"); });
              a.setAttribute("aria-current", "true");
            });
          }, { rootMargin: "-45% 0px -50% 0px" });
          document.querySelectorAll("main section[id]").forEach(function (s) { spy.observe(s); });

          var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
              if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); }
            });
          }, { rootMargin: "0px" });
          document.querySelectorAll(".reveal").forEach(function (el) { io.observe(el); });
        } else {
          document.querySelectorAll(".reveal").forEach(function (el) { el.classList.add("in"); });
        }
      })();
    </script>
